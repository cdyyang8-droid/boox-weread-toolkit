name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      - run: python tools/boox_tool.py list
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-30" "build-tools;35.0.0"
      - run: python3 tools/build_debug.py --android-jar "$ANDROID_HOME/platforms/android-30/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: app/build/manual/*-debug.apk
